<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8"></meta>
<meta content="width=device-width, initial-scale=1.0" name="viewport"></meta>
<title>Question Paper Generator</title>
<!-- 1. Configure MathJax to enable single $ inline math -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']]
    }
  };
</script>

<!-- 2. Load the correct MathJax v3 script -->
<script async id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<style>
:root {
--primary-color: #0284c7;
--surface-color: #ffffff;
--background-color: #f8fafc;
--text-main: #0f172a;
--border-color: #cbd5e1;
}

body {
font-family: 'Segoe UI', system-ui, sans-serif;
background-color: var(--background-color);
color: var(--text-main);
margin: 0;
padding: 20px;
}

.workspace {
  max-width: 900px;
  margin: 0px 0px; /* Changes 'auto' centering to left-aligned */
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.card {
background: var(--surface-color);
padding: 25px;
border-radius: 8px;
box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
border: 1px solid var(--border-color);
}

.panel-heading {
margin-top: 0;
border-bottom: 2px solid var(--border-color);
padding-bottom: 10px;
color: var(--primary-color);
}

.form-grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
gap: 15px;
margin-bottom: 20px;
}

.field-group {
display: flex;
flex-direction: column;
gap: 5px;
}

label {
font-size: 0.85rem;
font-weight: 600;
color: #475569;
}

input[type="text"], input[type="number"], input[type="date"], select {
padding: 8px 12px;
border: 1px solid var(--border-color);
border-radius: 4px;
font-size: 0.9rem;
background: white;
}

.matrix-header-label {
display: block;
font-weight: bold;
margin-bottom: 12px;
font-size: 1rem;
color: var(--primary-color);
border-bottom: 1px solid var(--border-color);
padding-bottom: 4px;
}

.chapter-matrix {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
gap: 12px;
background: #f1f5f9;
padding: 15px;
border-radius: 6px;
border: 1px solid var(--border-color);
margin-bottom: 20px;
}

.chapter-card {
background: white;
padding: 12px;
border-radius: 4px;
border: 1px solid #e2e8f0;
display: flex;
flex-direction: column;
gap: 8px;
}

.chapter-title {
font-weight: bold;
font-size: 0.95rem;
color: var(--primary-color);
display: flex;
align-items: center;
gap: 8px;
border-bottom: 1px dashed #e2e8f0;
padding-bottom: 4px;
}

.matrix-inputs-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 8px;
}

.sub-field {
display: flex;
flex-direction: column;
gap: 2px;
}

.sub-field label {
font-size: 0.72rem;
color: #475569;
font-weight: 600;
}

.sub-field input, .sub-field select {
padding: 4px 6px;
font-size: 0.8rem;
width: 100%;
box-sizing: border-box;
}

.avail-info {
font-size: 0.75rem;
color: #3d02c7;
font-style: italic;
display: block;
margin-top: 1px;
}

.allocation-5m-box {
background: #f0fdf4;
border: 1px solid #bbf7d0;
padding: 20px;
border-radius: 8px;
margin-bottom: 20px;
}

.row-5m {
display: grid;
grid-template-columns: auto 1fr 1fr;
gap: 15px;
align-items: center;
margin-top: 10px;
background: white;
padding: 12px;
border-radius: 6px;
border: 1px solid #cbd5e1;
}

.action-bar {
display: flex;
justify-content: center;
gap: 15px;
}

.btn {
background-color: var(--primary-color);
color: white;
border: none;
padding: 12px 24px;
border-radius: 4px;
font-weight: 600;
cursor: pointer;
transition: ease 0.2s;
}

.btn:hover { background-color: #0369a1; }
.btn-alt { background-color: #334155; }
.btn-alt:hover { background-color: #1e293b; }

#examination-document {
display: none;
background: #fff;
padding: 40px;
border: 1px solid #94a3b8;
}

.doc-header {
text-align: center;
border-bottom: 4px double #000;
padding-bottom: 10px;
margin-bottom: 20px;
}

.doc-meta-table {
width: 100%;
border-collapse: collapse;
margin-bottom: 25px;
font-weight: bold;
font-size: 0.95rem;
}

.doc-meta-table td {
border-bottom: 1px solid #000;
padding: 6px 0;
}

.part-header {
text-align: center;
font-weight: bold;
margin: 30px 0 5px 0;
text-transform: uppercase;
font-size: 1.1rem;
}

.part-instructions {
text-align: center;
font-style: italic;
font-size: 0.9rem;
margin-bottom: 15px;
padding: 0 10px;
}

.question-row {
display: flex;
margin-bottom: 12px;
page-break-inside: avoid;
}

.q-index { width: 35px; font-weight: bold; }
.q-body { flex: 1; text-align: justify; }

.mcq-container {
display: grid;
grid-template-columns: 1fr 1fr;
margin-top: 5px;
padding-left: 10px;
gap: 5px;
}

.either-or-separation {
text-align: center;
font-weight: bold;
margin: 8px 0;
font-size: 0.95rem;
text-transform: uppercase;
}

@media print {
    @page {
        size: A4 portrait;
        margin: 20mm 15mm 20mm 15mm; /* Standard professional paper margins */
    }
    
    html, body {
        width: 210mm;
        height: 297mm;
        background: #fff;
        color: #000;
        font-size: 12pt; /* Optimized font size for printed physical paper */
        margin: 0;
        padding: 0;
    }

    #examination-document {
        display: block !important;
        width: 100% !important;
        border: none !important;
        padding: 0 !important;
        margin: 0 !important;
    }

    /* Ensure structural question rows behave elegantly across page splits */
    .question-row, .row-5m {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
    }
}
</style>
</head>

<body>
<div class="workspace">
<div class="card no-print">
<h2 class="panel-heading">Question Paper Generator</h2>
<div class="form-grid">
<div class="field-group">
<label>Name of the School</label>
<input id="instName" type="text" value="Government Higher Secondary School" />
</div>
<div class="field-group">
<label>Name of the Exam</label>
<input id="examTitle" type="text" value="Revision Examination" />
</div>
<div class="field-group">
<label>Subject</label>
<input id="subject" type="text" value="Physics" />
</div>  
<div class="field-group">
<label>Time Duration</label>
<input id="timeValue" type="text" value="3 Hours" />
</div>
<div class="field-group">
<label>Date</label>
<input id="execDate" type="date" />
</div>
</div>

<label class="matrix-header-label">1, 2, 3 Marks Question Allocations Matrix Manager</label>
<div class="chapter-matrix" id="chapterSelectorPool"></div>

<div class="allocation-5m-box">
<label class="matrix-header-label" style="color:#16a34a; border-color:#bbf7d0;">5 Marks Chapter Allocation (Either / Or Sets)</label>
<div class="field-group" style="max-width: 320px; margin-bottom: 12px;">
<label>Total Number of 5-Mark Question (your Choice):</label>
<input type="number" id="count5m" min="0" max="10" value="5" onchange="render5MarkAllocators()" oninput="render5MarkAllocators()">
</div>
<div id="dynamic5mRows"></div>
</div>

<div class="action-bar">
<button class="btn" onclick="processEngineExecution()">Generate Question Paper</button>
</div>
</div>

<div class="action-bar no-print" id="runtimeActions" style="display: none; margin-bottom: 10px;">
<button class="btn" onclick="processEngineExecution()">Regenerate Randomly</button>
<button class="btn btn-alt" onclick="executeIsolatedPrint()">Print / Save as PDF</button>
</div>

<div class="card" id="examination-document">
<div class="doc-header">
<h1 id="out-inst" style="font-size: 1.5rem; margin: 0 0 5px 0;"></h1>
<h3 id="out-title" style="font-size: 1rem; font-weight: 500; margin: 0; text-transform: uppercase;"></h3>
</div>
<table class="doc-meta-table">
<tr>

<td style="width: 35%;">Date: <span id="out-date" style="font-weight: normal;"></span></td>
<td style="width: 18%;">Subject: <span id="out-subject" style="font-weight: normal;"></span></td>
<td style="text-align: center; width: 30%;">Time: <span id="out-time" style="font-weight: normal;"></span></td>
<td style="text-align: right; width: 35%;">Total Marks: <span id="out-marks"></span></td>
</tr>
</table>
<div id="document-payload"></div>
</div>
</div>

  		{ text: `Four Gaussian surfaces are given below with charges inside each Gaussian surface. Rank the electric flux through each Gaussian surface in increasing order:

        { text: `The magnetic field at the centre O of the following current loop is:

    <br><img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEija2D0p6SJbS2cAA7-js-RC-yTemXMDmVVRjSdyeglErJOlKpsBEKhYMFsEDN13RUGdQQtS2El5JB1T2Hz7MDqF75A1hnn4BY147VX4izDcxH7wQY-JDK646IIUPRw5V-tX8MGvclkAm2FpEs2RhFysk8fIy8NgHEGZY4E4U_hz67kurcXP9fOKkcCvAU/s381/3.1.png"

function getChapterStats(ch) {
    const bbMcq = QUESTION_DATABASE.mcqBookBack.filter(q => q.ch === ch).length;
    const biMcq = QUESTION_DATABASE.mcqBookInside.filter(q => q.ch === ch).length;
    const t2Th = QUESTION_DATABASE.twoMarks.theory.filter(q => q.ch === ch).length;
    const t2Pr = QUESTION_DATABASE.twoMarks.problems.filter(q => q.ch === ch).length;
    const t3Th = QUESTION_DATABASE.threeMarks.theory.filter(q => q.ch === ch).length;
    const t3Pr = QUESTION_DATABASE.threeMarks.problems.filter(q => q.ch === ch).length;
    return { bbMcq, biMcq, twoM: t2Th + t2Pr, threeM: t3Th + t3Pr };
}

function render5MarkAllocators() {
    const totalSets = parseInt(document.getElementById('count5m').value) || 0;
    const targetDiv = document.getElementById('dynamic5mRows');
    targetDiv.innerHTML = "";

    for (let s = 1; s <= totalSets; s++) {
        let optionsA = `<option value="">-- Choose Chapter --</option>`;
        let optionsB = `<option value="">-- Choose Chapter --</option>`;
        
        for (let ch = 1; ch <= totalChapters; ch++) {
            let selectedA = (ch === ((s - 1) % totalChapters + 1)) ? 'selected' : '';
            let selectedB = (ch === (s % totalChapters + 1)) ? 'selected' : '';
            
            optionsA += `<option value="${ch}" ${selectedA}>Chapter ${ch}</option>`;
            optionsB += `<option value="${ch}" ${selectedB}>Chapter ${ch}</option>`;

}

// 33% Problem Allocation Rule function restored
function getBalancedRandomPool(theoryPool, problemPool, pickedCompulsory, totalNeeded, totalProblemsAllowed, activeChapters) {
    let availableProblems = problemPool.filter(p => p !== pickedCompulsory);
    let availableTheory = [...theoryPool];
    
    let extraProblemsNeeded = Math.max(0, totalProblemsAllowed - (pickedCompulsory ? 1 : 0));
    let theoryNeeded = Math.max(0, totalNeeded - extraProblemsNeeded);
    
    let theoryByChapter = {};
    let problemsByChapter = {};
    activeChapters.forEach(ch => {
        theoryByChapter[ch] = [];
        problemsByChapter[ch] = [];
    });
    
    availableTheory.forEach(q => { if (theoryByChapter[q.ch]) theoryByChapter[q.ch].push(q); });
    availableProblems.forEach(q => { if (problemsByChapter[q.ch]) problemsByChapter[q.ch].push(q); });
    
    let selectedQuestions = [];
    let shuffledChapters = [...activeChapters].sort(() => Math.random() - 0.5);
    
    let problemsPickedCount = 0;
    for (let i = 0; i < shuffledChapters.length && problemsPickedCount < extraProblemsNeeded; i++) {
        let ch = shuffledChapters[i];
        let chPool = problemsByChapter[ch];
        if (chPool && chPool.length > 0) {
            let randomIndex = Math.floor(Math.random() * chPool.length);
            selectedQuestions.push(chPool[randomIndex]);
            chPool.splice(randomIndex, 1);
            problemsPickedCount++;
        }
    }
    
    if (problemsPickedCount < extraProblemsNeeded) {
        let leftoverProblems = [];
        shuffledChapters.forEach(ch => leftoverProblems.push(...(problemsByChapter[ch] || [])));
        leftoverProblems.sort(() => Math.random() - 0.5);
        while (problemsPickedCount < extraProblemsNeeded && leftoverProblems.length > 0) {
            selectedQuestions.push(leftoverProblems.pop());
            problemsPickedCount++;
        }
    }
    
    let theoryPickedCount = 0;
    for (let i = 0; i < shuffledChapters.length && theoryPickedCount < theoryNeeded; i++) {
        let ch = shuffledChapters[i];
        let chPool = theoryByChapter[ch];
        if (chPool && chPool.length > 0) {
            let randomIndex = Math.floor(Math.random() * chPool.length);
            selectedQuestions.push(chPool[randomIndex]);
            chPool.splice(randomIndex, 1);
            theoryPickedCount++;
        }
    }
    
    if (theoryPickedCount < theoryNeeded) {
        let leftoverTheory = [];
        shuffledChapters.forEach(ch => leftoverTheory.push(...(theoryByChapter[ch] || [])));
        leftoverTheory.sort(() => Math.random() - 0.5);
        while (theoryPickedCount < theoryNeeded && leftoverTheory.length > 0) {
            selectedQuestions.push(leftoverTheory.pop());
            theoryPickedCount++;
        }
    }
    
    return selectedQuestions.sort(() => Math.random() - 0.5);
}

    document.getElementById('out-date').innerText = document.getElementById('execDate').value || new Date().toLocaleDateString();

    const activeChapters = Array.from(document.querySelectorAll('.ch-filter-item:checked')).map(el => parseInt(el.value));
    if (activeChapters.length === 0) {
        alert("Please pick at least one valid active chapter checkbox.");
        return;
    }

    let payloadHTML = "";
    let globalQuestionIndex = 1;
    let computedTotalMarks = 0;
    let used5mQuestions = new Set(); 

    // ------------------- PART A: 1 MARK GENERATION -------------------
    let partAMcqsPool = [];
    activeChapters.forEach(ch => {
        const bbCount = parseInt(document.querySelector(`.ch-m1bb-input[data-ch="${ch}"]`).value) || 0;
        const biCount = parseInt(document.querySelector(`.ch-m1bi-input[data-ch="${ch}"]`).value) || 0;

        let matchBB = QUESTION_DATABASE.mcqBookBack.filter(q => q.ch === ch).sort(() => Math.random() - 0.5);
        let matchBI = QUESTION_DATABASE.mcqBookInside.filter(q => q.ch === ch).sort(() => Math.random() - 0.5);

        for (let i = 0; i < Math.min(bbCount, matchBB.length); i++) partAMcqsPool.push(matchBB[i]);
        for (let i = 0; i < Math.min(biCount, matchBI.length); i++) partAMcqsPool.push(matchBI[i]);
    });

    if (partAMcqsPool.length > 0) {
        payloadHTML += `<div class="part-header">PART - A</div>`;
        payloadHTML += `<div class="part-instructions">Answer all the questions. Each question carries 1 mark.</div>`;
        partAMcqsPool.forEach(q => {
            payloadHTML += `
            <div class="question-row">
                <div class="q-index">${globalQuestionIndex++}.</div>
                <div class="q-body">
                    ${q.text}
                    <div class="mcq-container">
                        ${q.options.map((o, idx) => `<div>${String.fromCharCode(97 + idx)}) ${o}</div>`).join('')}
                    </div>
                </div>
            </div>`;
            computedTotalMarks += 1;
        });
    }

    // ------------------- PART B: 2 MARKS GENERATION -------------------
    let total2mRequested = 0;
    activeChapters.forEach(ch => {
        total2mRequested += parseInt(document.querySelector(`.ch-m2-input[data-ch="${ch}"]`).value) || 0;
    });

    if (total2mRequested > 0) {
        let rawTheory2m = [];
        let rawProblems2m = [];
        activeChapters.forEach(ch => {
            rawTheory2m.push(...QUESTION_DATABASE.twoMarks.theory.filter(q => q.ch === ch));
            rawProblems2m.push(...QUESTION_DATABASE.twoMarks.problems.filter(q => q.ch === ch));
        });

        // Apply 33% rule
        let allowedProblems2m = Math.round(total2mRequested * 0.33);
        let pickedCompulsory2m = rawProblems2m.sort(() => Math.random() - 0.5)[0] || null;
        
        let chosen2mPool = getBalancedRandomPool(rawTheory2m, rawProblems2m, pickedCompulsory2m, total2mRequested - (pickedCompulsory2m ? 1 : 0), allowedProblems2m, activeChapters);
        if (pickedCompulsory2m) chosen2mPool.push(pickedCompulsory2m);

        payloadHTML += `<div class="part-header">PART - B</div>`;
        payloadHTML += `<div class="part-instructions">Answer the following questions. Each question carries 2 marks.</div>`;
        chosen2mPool.forEach(q => {
            payloadHTML += `
            <div class="question-row">
                <div class="q-index">${globalQuestionIndex++}.</div>
                <div class="q-body">${q.text}</div>
            </div>`;
            computedTotalMarks += 2;
        });
    }

    // ------------------- PART C: 3 MARKS GENERATION -------------------
    let total3mRequested = 0;
    activeChapters.forEach(ch => {
        total3mRequested += parseInt(document.querySelector(`.ch-m3-input[data-ch="${ch}"]`).value) || 0;
    });

    if (total3mRequested > 0) {
        let rawTheory3m = [];
        let rawProblems3m = [];
        activeChapters.forEach(ch => {
            rawTheory3m.push(...QUESTION_DATABASE.threeMarks.theory.filter(q => q.ch === ch));
            rawProblems3m.push(...QUESTION_DATABASE.threeMarks.problems.filter(q => q.ch === ch));
        });

        // Apply 33% rule
        let allowedProblems3m = Math.round(total3mRequested * 0.33);
        let pickedCompulsory3m = rawProblems3m.sort(() => Math.random() - 0.5)[0] || null;

        let chosen3mPool = getBalancedRandomPool(rawTheory3m, rawProblems3m, pickedCompulsory3m, total3mRequested - (pickedCompulsory3m ? 1 : 0), allowedProblems3m, activeChapters);
        if (pickedCompulsory3m) chosen3mPool.push(pickedCompulsory3m);

        payloadHTML += `<div class="part-header">PART - C</div>`;
        payloadHTML += `<div class="part-instructions">Answer the following questions. Each question carries 3 marks.</div>`;
        chosen3mPool.forEach(q => {
            payloadHTML += `
            <div class="question-row">
                <div class="q-index">${globalQuestionIndex++}.</div>
                <div class="q-body">${q.text}</div>
            </div>`;
            computedTotalMarks += 3;
        });
    }

    // ------------------- PART D: 5 MARKS ENGINE -------------------
    const total5mSets = parseInt(document.getElementById('count5m').value) || 0;
    
    if (total5mSets > 0) {
        payloadHTML += `<div class="part-header">PART - D</div>`;
        payloadHTML += `<div class="part-instructions">Answer all the questions choosing either option (a) or option (b). Each set carries 5 marks.</div>`;

        const rowElements = document.querySelectorAll('#dynamic5mRows .row-5m');
        
        rowElements.forEach((row) => {
            let selChA = row.querySelector('.ch-5ma-select').value;
            let selChB = row.querySelector('.ch-5mb-select').value;

            let targetChA = selChA ? parseInt(selChA) : activeChapters[Math.floor(Math.random() * activeChapters.length)];
            let targetChB = selChB ? parseInt(selChB) : activeChapters[Math.floor(Math.random() * activeChapters.length)];

            let availablePoolA = [
                ...QUESTION_DATABASE.fiveMarks.groupA.filter(q => q.ch === targetChA),
                ...QUESTION_DATABASE.fiveMarks.groupB.filter(q => q.ch === targetChA)
            ].filter(q => !used5mQuestions.has(q.text)).sort(() => Math.random() - 0.5);

            let availablePoolB = [
                ...QUESTION_DATABASE.fiveMarks.groupA.filter(q => q.ch === targetChB),
                ...QUESTION_DATABASE.fiveMarks.groupB.filter(q => q.ch === targetChB)
            ].filter(q => !used5mQuestions.has(q.text)).sort(() => Math.random() - 0.5);

            let chosenQ_A = availablePoolA.length > 0 ? availablePoolA[0] : null;
            if (chosenQ_A) {
                used5mQuestions.add(chosenQ_A.text);
            } else {
                chosenQ_A = { text: `[Long-form Descriptive Question Placeholder for Chapter ${targetChA}]` };
            }

            let filteredPoolB = availablePoolB.filter(q => q.text !== chosenQ_A.text);
            let chosenQ_B = filteredPoolB.length > 0 ? filteredPoolB[0] : null;
            if (chosenQ_B) {
                used5mQuestions.add(chosenQ_B.text);
            } else {
                chosenQ_B = { text: `[Long-form Descriptive Question Placeholder for Chapter ${targetChB}]` };
            }

            payloadHTML += `
            <div style="margin-bottom: 20px; page-break-inside: avoid;">
                <div class="question-row" style="margin-bottom: 2px;">
                    <div class="q-index">${globalQuestionIndex}.</div>
                    <div class="q-body"><strong>(a)</strong> ${chosenQ_A.text}</div>
                </div>
                <div class="either-or-separation">OR</div>
                <div class="question-row">
                    <div class="q-index"></div>
                    <div class="q-body"><strong>(b)</strong> ${chosenQ_B.text}</div>
                </div>
            </div>`;
            
            globalQuestionIndex++;
            computedTotalMarks += 5;
        });
    }

    document.getElementById('document-payload').innerHTML = payloadHTML;
    document.getElementById('out-marks').innerText = computedTotalMarks;
    document.getElementById('examination-document').style.display = 'block';
    document.getElementById('runtimeActions').style.display = 'flex';

    if (window.MathJax) {
        window.MathJax.typesetPromise();
    }
}

function executeIsolatedPrint() {
const targetElement = document.getElementById('examination-document');
if(!targetElement || targetElement.style.display === 'none') {
alert("Please generate a question paper before attempting to print.");
return;
}
const paperMarkupContent = targetElement.innerHTML;
let oldFrame = document.getElementById('isolatedPrintFrame');
if(oldFrame) oldFrame.remove();

const iframe = document.createElement('iframe');
iframe.id = 'isolatedPrintFrame';
iframe.style.position = 'fixed';
iframe.style.bottom = '0';
iframe.style.right = '0';
iframe.style.width = '0';
iframe.style.height = '0';
iframe.style.border = 'none';
document.body.appendChild(iframe);

const frameDoc = iframe.contentWindow.document;
frameDoc.write(`
<!DOCTYPE html>
<html>
<head>
<title>Question Paper</title>
<meta charset="UTF-8">
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/MathJax.js?config=TeX-MML-AM_CHTML"><\/script>
<style>
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #ffffff; color: #000000; margin: 0; padding: 10px; }
.doc-header { text-align: center; border-bottom: 4px double #000; padding-bottom: 10px; margin-bottom: 20px; }
.doc-meta-table { width: 100%; border-collapse: collapse; margin-bottom: 25px; font-weight: bold; font-size: 0.95rem; }
.doc-meta-table td { border-bottom: 1px solid #000; padding: 6px 0; }
.part-header { text-align: center; font-weight: bold; margin: 30px 0 5px 0; text-transform: uppercase; font-size: 1.1rem; }
.part-instructions { text-align: center; font-style: italic; font-size: 0.9rem; margin-bottom: 15px; }
.question-row { display: flex; margin-bottom: 12px; page-break-inside: avoid; }
.q-index { width: 35px; font-weight: bold; }
.q-body { flex: 1; text-align: justify; }
.q-score { width: 55px; text-align: right; font-weight: bold; }
.mcq-container { display: grid; grid-template-columns: 1fr 1fr; margin-top: 5px; padding-left: 10px; }
.either-or-separation { text-align: center; font-weight: bold; margin: 8px 0; }
img { max-width: 120px !important; height: auto !important; display: block; margin-top: 5px; }
</style>
</head>
<body>
<div id="print-canvas">${paperMarkupContent}</div>
</body>
</html>
`);
frameDoc.close();

iframe.contentWindow.addEventListener('load', function() {
setTimeout(function() {
iframe.contentWindow.focus();
iframe.contentWindow.print();
}, 1000);
});
}
</script>
</body>
</html>
